name: Build and Publish Docker Images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'manifests/**'
      - 'scripts/**'
      - 'Makefile'
      - 'devbox.json'
      - 'devbox.lock'
      - '.github/workflows/build-and-publish.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-database:
    runs-on: instant-cf-cached-privileged-kubernetes
    container:
      image: nixery.dev/shell/bash/findutils/coreutils/gnutar/gnugrep/gzip/busybox/cacert
      options: --privileged --init
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker and Nix Store
        run: .github/scripts/docker-setup.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-database
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install bob (BOSH OCI Builder)
        env:
          GH_TOKEN: ${{ secrets.GIT_BOB_PULL_SECRET }}
        run: |
          # Use devbox script to install bob CLI
          devbox run install-bob

      - name: Sync vendored dependencies
        run: |
          devbox run -- make sync

      - name: Build Database BOSH OCI image with bob
        timeout-minutes: 60
        run: |
          # Build the database image using bob
          devbox run -- make build-database

      - name: Tag and push Database image
        run: |
          # Find the image that bob created and tag it with all metadata tags
          # Bob may create the image with a different name than expected
          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "instant-cf-database" | grep -v "none" | head -1)
          
          if [ -z "$IMAGE_ID" ]; then
            echo "Error: Could not find instant-cf-database image"
            docker images
            exit 1
          fi
          
          echo "Found image: $IMAGE_ID"
          
          # Tag and push with all metadata tags
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            echo "Tagging $IMAGE_ID as $tag"
            docker tag "$IMAGE_ID" "$tag"
            echo "Pushing $tag"
            docker push "$tag"
          done

  build-runtime:
    runs-on: instant-cf-cached-privileged-kubernetes
    container:
      image: nixery.dev/shell/bash/findutils/coreutils/gnutar/gnugrep/gzip/busybox/cacert
      options: --privileged --init
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker and Nix Store
        run: .github/scripts/docker-setup.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-runtime
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install bob (BOSH OCI Builder)
        env:
          GH_TOKEN: ${{ secrets.GIT_BOB_PULL_SECRET }}
        run: |
          # Use devbox script to install bob CLI
          devbox run install-bob

      - name: Sync vendored dependencies
        run: |
          devbox run -- make sync

      - name: Build Runtime BOSH OCI image with bob
        timeout-minutes: 60
        run: |
          # Build the runtime image using bob
          devbox run -- make build-runtime

      - name: Tag and push Runtime image
        run: |
          # Find the image that bob created and tag it with all metadata tags
          # Bob may create the image with a different name than expected
          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "instant-cf-runtime" | grep -v "none" | head -1)
          
          if [ -z "$IMAGE_ID" ]; then
            echo "Error: Could not find instant-cf-runtime image"
            docker images
            exit 1
          fi
          
          echo "Found image: $IMAGE_ID"
          
          # Tag and push with all metadata tags
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            echo "Tagging $IMAGE_ID as $tag"
            docker tag "$IMAGE_ID" "$tag"
            echo "Pushing $tag"
            docker push "$tag"
          done
