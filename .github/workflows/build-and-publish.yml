name: Build and Publish Docker Images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'manifests/**'
      - 'scripts/**'
      - 'Makefile'
      - 'devbox.json'
      - 'devbox.lock'
      - '.github/workflows/build-and-publish.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-database:
    runs-on: instant-cf-cached-privileged-kubernetes
    container:
      image: nixery.dev/shell/bash/findutils/coreutils/gnutar/gnugrep/gzip/busybox/cacert
      options: --privileged --init
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        run: .github/scripts/nix-setup.sh

      - name: Install Devbox
        run: .github/scripts/install-devbox.sh

      - name: Install Docker CLI
        run: .github/scripts/install-docker.sh

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-database
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install bob (BOSH OCI Builder)
        env:
          GH_TOKEN: ${{ secrets.GIT_BOB_PULL_SECRET }}
        run: |
          # Use devbox script to install bob CLI
          devbox run install-bob

      - name: Sync vendored dependencies
        run: |
          devbox run -- make sync

      - name: Build Database BOSH OCI image with bob
        timeout-minutes: 120
        run: |
          # Build the database image using bob
          devbox run -- make build-database

      - name: Tag and push Database image
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          devbox run -- .github/scripts/tag-and-push-image.sh "instant-cf-database" "$METADATA_TAGS"

  build-runtime:
    runs-on: instant-cf-cached-privileged-kubernetes
    container:
      image: nixery.dev/shell/bash/findutils/coreutils/gnutar/gnugrep/gzip/busybox/cacert
      options: --privileged --init
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        run: .github/scripts/nix-setup.sh

      - name: Install Devbox
        run: .github/scripts/install-devbox.sh

      - name: Install Docker CLI
        run: .github/scripts/install-docker.sh

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-runtime
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install bob (BOSH OCI Builder)
        env:
          GH_TOKEN: ${{ secrets.GIT_BOB_PULL_SECRET }}
        run: |
          # Use devbox script to install bob CLI
          devbox run install-bob

      - name: Sync vendored dependencies
        run: |
          devbox run -- make sync

      - name: Build Runtime BOSH OCI image with bob
        timeout-minutes: 120
        run: |
          # Build the runtime image using bob
          devbox run -- make build-runtime

      - name: Tag and push Runtime image
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          devbox run -- .github/scripts/tag-and-push-image.sh "instant-cf-runtime" "$METADATA_TAGS"
