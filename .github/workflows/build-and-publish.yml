name: Build and Publish Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'manifests/**'
      - 'scripts/**'
      - 'Makefile'
      - 'devbox.json'
      - 'devbox.lock'
      - '.github/workflows/build-and-publish.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: instant-cf-dind
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-database
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install xz-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Devbox
        run: |
          curl -fsSL https://get.jetify.com/devbox | bash -s -- -f
          devbox version

      - name: Install bob (BOSH OCI Builder)
        env:
          GH_TOKEN: ${{ secrets.GIT_BOB_PULL_SECRET }}
        run: |
          # Clone the bob repository using the token
          git clone https://x-access-token:${GH_TOKEN}@github.com/rkoster/bosh-oci-builder.git /tmp/bosh-oci-builder
          
          # Add bob flake from the cloned repo to devbox
          devbox add path:/tmp/bosh-oci-builder#bob
          
          # Verify installation
          devbox run -- bob --help

      - name: Sync vendored dependencies
        run: |
          devbox run -- make sync

      - name: Build BOSH OCI image with bob
        timeout-minutes: 30
        run: |
          devbox run -- make build-phase1-database

      - name: Tag and push image
        run: |
          # Find the image that bob created and tag it with all metadata tags
          # Bob may create the image with a different name than expected
          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "instant-cf-database" | grep -v "none" | head -1)
          
          if [ -z "$IMAGE_ID" ]; then
            echo "Error: Could not find instant-cf-database image"
            docker images
            exit 1
          fi
          
          echo "Found image: $IMAGE_ID"
          
          # Tag and push with all metadata tags
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            echo "Tagging $IMAGE_ID as $tag"
            docker tag "$IMAGE_ID" "$tag"
            echo "Pushing $tag"
            docker push "$tag"
          done
