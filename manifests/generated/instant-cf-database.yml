instance_groups:
- azs:
  - z1
  instances: 1
  jobs:
  - name: postgres
    properties:
      databases:
        databases:
        - citext: true
          name: cloud_controller
          tag: cc
        - citext: true
          name: uaa
          tag: uaa
        - citext: true
          name: diego
          tag: diego
        - citext: true
          name: routing-api
          tag: routing-api
        - citext: false
          name: network_policy
          tag: networkpolicy
        - citext: false
          name: network_connectivity
          tag: networkconnectivity
        - citext: true
          name: locket
          tag: locket
        - citext: true
          name: credhub
          tag: credhub
        db_scheme: postgres
        port: 5524
        roles:
        - name: cloud_controller
          password: ((cc_database_password))
          tag: admin
        - name: uaa
          password: ((uaa_database_password))
          tag: admin
        - name: diego
          password: ((diego_database_password))
          tag: admin
        - name: routing-api
          password: ((routing_api_database_password))
          tag: admin
        - name: network_policy
          password: ((network_policy_database_password))
          tag: admin
        - name: network_connectivity
          password: ((network_connectivity_database_password))
          tag: admin
        - name: locket
          password: ((locket_database_password))
          tag: locket
        - name: credhub
          password: ((credhub_database_password))
          tag: admin
    release: postgres
  migrated_from:
  - name: postgres
  - name: singleton-database
  name: database
  networks:
  - name: instant-cf
    static_ips:
    - 10.245.0.10
  persistent_disk_type: 10GB
  stemcell: default
  update:
    serial: true
  vm_type: small
