name: cf
manifest_version: v53.8.0
update:
  canaries: 1
  canary_watch_time: 30000-1200000
  max_in_flight: 1
  serial: false
  update_watch_time: 5000-1200000
addons:
- name: loggregator_agent
  include:
    stemcell:
    - os: ubuntu-bionic
    - os: ubuntu-jammy
  exclude:
    jobs:
    - name: smoke_tests
      release: cf-smoke-tests
  jobs:
  - name: loggregator_agent
    release: loggregator-agent
    properties:
      grpc_port: 3459
      disable_udp: true
      loggregator:
        tls:
          ca_cert: ((loggregator_tls_agent.ca))
          agent:
            cert: ((loggregator_tls_agent.certificate))
            key: ((loggregator_tls_agent.private_key))
      metrics:
        ca_cert: ((loggregator_agent_metrics_tls.ca))
        cert: ((loggregator_agent_metrics_tls.certificate))
        key: ((loggregator_agent_metrics_tls.private_key))
        server_name: loggregator_agent_metrics
- name: forwarder_agent
  include:
    stemcell:
    - os: ubuntu-bionic
    - os: ubuntu-jammy
  jobs:
  - name: loggr-forwarder-agent
    release: loggregator-agent
    properties:
      tls:
        ca_cert: ((loggregator_tls_agent.ca))
        cert: ((loggregator_tls_agent.certificate))
        key: ((loggregator_tls_agent.private_key))
      metrics:
        ca_cert: ((forwarder_agent_metrics_tls.ca))
        cert: ((forwarder_agent_metrics_tls.certificate))
        key: ((forwarder_agent_metrics_tls.private_key))
        server_name: forwarder_agent_metrics
- name: loggr-syslog-agent
  include:
    stemcell:
    - os: ubuntu-bionic
    - os: ubuntu-jammy
  exclude:
    jobs:
    - name: smoke_tests
      release: cf-smoke-tests
  jobs:
  - name: loggr-syslog-agent
    release: loggregator-agent
    properties:
      port: 3460
      tls:
        ca_cert: ((loggregator_tls_agent.ca))
        cert: ((loggregator_tls_agent.certificate))
        key: ((loggregator_tls_agent.private_key))
      cache:
        tls:
          ca_cert: ((syslog_agent_api_tls.ca))
          cert: ((syslog_agent_api_tls.certificate))
          key: ((syslog_agent_api_tls.private_key))
          cn: binding-cache
      metrics:
        ca_cert: ((syslog_agent_metrics_tls.ca))
        cert: ((syslog_agent_metrics_tls.certificate))
        key: ((syslog_agent_metrics_tls.private_key))
        server_name: syslog_agent_metrics
- name: prom_scraper
  include:
    stemcell:
    - os: ubuntu-bionic
    - os: ubuntu-jammy
  exclude:
    jobs:
    - name: smoke_tests
      release: cf-smoke-tests
  jobs:
  - name: prom_scraper
    release: loggregator-agent
    properties:
      scrape_interval: 60s
      scrape:
        tls:
          ca_cert: ((prom_scraper_scrape_tls.ca))
          cert: ((prom_scraper_scrape_tls.certificate))
          key: ((prom_scraper_scrape_tls.private_key))
      metrics:
        ca_cert: ((prom_scraper_metrics_tls.ca))
        cert: ((prom_scraper_metrics_tls.certificate))
        key: ((prom_scraper_metrics_tls.private_key))
        server_name: prom_scraper_metrics
- name: bpm
  include:
    stemcell:
    - os: ubuntu-bionic
    - os: ubuntu-jammy
  jobs:
  - name: bpm
    release: bpm
- name: bosh-dns-aliases
  jobs:
  - name: bosh-dns-aliases
    release: bosh-dns-aliases
    properties:
      aliases:
      - domain: _.cell.service.cf.internal
        targets:
        - query: _
          instance_group: diego-cell
          deployment: cf
          network: default
          domain: bosh
        - query: _
          instance_group: windows2019-cell
          deployment: cf
          network: default
          domain: bosh
        - query: _
          instance_group: isolated-diego-cell
          deployment: cf
          network: default
          domain: bosh
      - domain: auctioneer.service.cf.internal
        targets:
        - query: q-s4
          instance_group: scheduler
          deployment: cf
          network: default
          domain: bosh
      - domain: bbs.service.cf.internal
        targets:
        - query: q-s4
          instance_group: diego-api
          deployment: cf
          network: default
          domain: bosh
      - domain: blobstore.service.cf.internal
        targets:
        - query: '*'
          instance_group: singleton-blobstore
          deployment: cf
          network: default
          domain: bosh
      - domain: cc-uploader.service.cf.internal
        targets:
        - query: '*'
          instance_group: api
          deployment: cf
          network: default
          domain: bosh
      - domain: cloud-controller-ng.service.cf.internal
        targets:
        - query: '*'
          instance_group: api
          deployment: cf
          network: default
          domain: bosh
      - domain: credhub.service.cf.internal
        targets:
        - query: '*'
          instance_group: credhub
          deployment: cf
          network: default
          domain: bosh
      - domain: doppler.service.cf.internal
        targets:
        - query: '*'
          instance_group: doppler
          deployment: cf
          network: default
          domain: bosh
      - domain: file-server.service.cf.internal
        targets:
        - query: '*'
          instance_group: api
          deployment: cf
          network: default
          domain: bosh
      - domain: gorouter.service.cf.internal
        targets:
        - query: '*'
          instance_group: router
          deployment: cf
          network: default
          domain: bosh
      - domain: locket.service.cf.internal
        targets:
        - query: '*'
          instance_group: diego-api
          deployment: cf
          network: default
          domain: bosh
      - domain: loggregator-trafficcontroller.service.cf.internal
        targets:
        - query: '*'
          instance_group: log-api
          deployment: cf
          network: default
          domain: bosh
      - domain: policy-server.service.cf.internal
        targets:
        - query: '*'
          instance_group: api
          deployment: cf
          network: default
          domain: bosh
      - domain: reverse-log-proxy.service.cf.internal
        targets:
        - query: '*'
          instance_group: log-api
          deployment: cf
          network: default
          domain: bosh
      - domain: routing-api.service.cf.internal
        targets:
        - query: '*'
          instance_group: api
          deployment: cf
          network: default
          domain: bosh
      - domain: silk-controller.service.cf.internal
        targets:
        - query: '*'
          instance_group: diego-api
          deployment: cf
          network: default
          domain: bosh
      - domain: sql-db.service.cf.internal
        targets:
        - query: '*'
          instance_group: database
          deployment: cf
          network: default
          domain: bosh
      - domain: ssh-proxy.service.cf.internal
        targets:
        - query: '*'
          instance_group: scheduler
          deployment: cf
          network: default
          domain: bosh
      - domain: tps.service.cf.internal
        targets:
        - query: '*'
          instance_group: scheduler
          deployment: cf
          network: default
          domain: bosh
      - domain: uaa.service.cf.internal
        targets:
        - query: '*'
          instance_group: uaa
          deployment: cf
          network: default
          domain: bosh
      - domain: nats.service.cf.internal
        targets:
        - query: '*'
          instance_group: nats
          deployment: cf
          network: default
          domain: bosh
      - domain: _.nats.service.cf.internal
        targets:
        - query: _
          instance_group: nats
          deployment: cf
          network: default
          domain: bosh
      - domain: log-cache.service.cf.internal
        targets:
        - query: '*'
          instance_group: log-cache
          deployment: cf
          network: default
          domain: bosh
instance_groups:
- name: database
  azs:
  - z1
  instances: 1
  vm_type: minimal
  stemcell: default
  networks:
  - name: instant-cf
    static_ips:
    - 10.245.0.10
  persistent_disk_type: 10GB
  jobs:
  - name: postgres
    release: postgres
    properties:
      databases:
        port: 5524
        databases:
        - name: cloud_controller
          citext: true
        - name: uaa
        - name: diego
        - name: network_policy
        - name: network_connectivity
        - name: routing-api
        - name: locket
        roles:
        - name: cloud_controller
          password: ((cc_database_password))
        - name: uaa
          password: ((uaa_database_password))
        - name: diego
          password: ((diego_database_password))
        - name: network_policy
          password: ((network_policy_database_password))
        - name: network_connectivity
          password: ((network_connectivity_database_password))
        - name: routing-api
          password: ((routing_api_database_password))
        - name: locket
          password: ((locket_database_password))
